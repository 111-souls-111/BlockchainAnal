# Root logger option
log4j.rootLogger=DEBUG, stdout

# \u041d\u0430\u0448 \u043f\u0430\u043a\u0435\u0442. \u0423\u0440\u043e\u0432\u0435\u043d\u044c DEBUG. \u041f\u043e\u0434\u043a\u043b\u044e\u0447\u0430\u0435\u043c \u043a\u043e\u043d\u0441\u043e\u043b\u044c (stdout) \u0438 \u0444\u0430\u0439\u043b (file)
log4j.logger.ru.sfedu.blockchain=DEBUG, stdout, file

# \u041a\u043e\u043d\u0441\u043e\u043b\u044c\u043d\u044b\u0439 \u0430\u043f\u043f\u0435\u043d\u0434\u0435\u0440
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# \u0424\u0430\u0439\u043b\u043e\u0432\u044b\u0439 \u0430\u043f\u043f\u0435\u043d\u0434\u0435\u0440 (RollingFileAppender)
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=logs/app.log
log4j.appender.file.append=true
log4j.appender.file.MaxFileSize=500KB
log4j.appender.file.MaxBackupIndex=2
log4j.appender.file.immediateFlush=true
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{MM.dd:HH.mm.ss} %5p\t%c:%L - %m%n